<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RL Cloud Scheduler - Replay Dashboard</title>
<style>
  :root { font-family: system-ui, Segoe UI, sans-serif; }
  body { margin: 0; background: #f4f5f7; color: #1c2733; }
  header { background: #10375c; color: #fff; padding: 12px 24px; }
  header h1 { font-size: 1.2rem; margin: 0; }
  main { padding: 16px 24px; max-width: 1100px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #d8dee6; border-radius: 8px;
          padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 10px; color: #10375c; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .stat { font-size: 1.6rem; font-weight: 600; min-width: 90px; }
  .stat small { display: block; font-size: .72rem; font-weight: 400;
                color: #5a6b7b; }
  select { padding: 6px 10px; border-radius: 6px; border: 1px solid #aab4c0; }
  button { padding: 6px 14px; border-radius: 6px; border: 1px solid #10375c;
           background: #10375c; color: #fff; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .bars { display: grid; grid-template-columns: 64px 1fr 48px; gap: 4px 8px;
          align-items: center; margin: 10px 0; }
  .barbg { background: #e8ecf1; border-radius: 4px; height: 16px; }
  .bar { background: #2f80ed; border-radius: 4px; height: 16px;
         transition: width .1s linear; }
  .bar.warn { background: #eb5757; }
  input[type=range] { width: 100%; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  th, td { border-bottom: 1px solid #e5e9ef; padding: 6px 8px;
           text-align: right; }
  th:first-child, td:first-child,
  th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { background: #10375c; color: #fff; position: sticky; top: 0; }
  tbody tr:hover { background: #eef4fb; }
  .charts img { width: 100%; max-width: 900px; display: block;
                margin: 8px auto; border: 1px solid #d8dee6;
                border-radius: 6px; }
  .err { color: #c0392b; }
</style>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/htm.js"></script>
</head>
<body>
<header><h1>RL Cloud Scheduler &mdash; simulation replay dashboard</h1></header>
<main id="root"></main>
<script src="app.js"></script>
</body>
</html>
